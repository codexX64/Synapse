<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SYNAPSE — Entonnoir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505; --panel:rgba(13,13,14,.85); --panel-line:rgba(255,255,255,.09);
  --txt:#f1f1f1; --mut:#9c9c9c; --dim:#575757;
  --cyan:#46e3ff; --mint:#3fe8a8; --violet:#b18cff; --amber:#ffb45e;
  --coral:#ff5c7a; --gold:#ffd75e; --teal:#6ef3d6; --pink:#f08fff;
  --mono:'JetBrains Mono',monospace; --disp:'Space Grotesk',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#0c0c0d 0%,#050505 62%);color:var(--txt);font-family:var(--mono);font-size:13px}
button,input{font-family:var(--mono)}
:focus-visible{outline:1.5px solid #fff;outline-offset:2px}
#stage{position:fixed;inset:0}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.8) 100%)}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-140%);font-size:10.5px;letter-spacing:.08em;color:var(--txt);
  text-shadow:0 0 6px rgba(0,0,0,.95),0 1px 2px rgba(0,0,0,.95);white-space:nowrap;opacity:0;transition:opacity .25s}
.lbl.on{opacity:.95}
.lbl small{display:block;text-align:center;color:var(--mut);font-size:9px;letter-spacing:.12em}
.lbl.sqt{font-size:11px;font-weight:700;letter-spacing:.14em}
.lbl.cnt{transform:translate(-50%,10%);font-size:19px;font-weight:700}
.lbl.cnt small{font-size:9px}
.lbl.ctx{font-size:13px;font-weight:700;letter-spacing:.2em;color:var(--amber)}

header{position:fixed;top:0;left:0;right:0;z-index:30;height:52px;display:flex;align-items:center;gap:14px;
  padding:0 16px;background:linear-gradient(180deg,rgba(5,5,5,.94),rgba(5,5,5,.55) 80%,transparent);}
#wordmark{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:.26em;color:#fff}
#demoTag{font-size:9px;letter-spacing:.18em;color:var(--mut);border:1px solid var(--panel-line);padding:3px 7px;border-radius:4px}
#demoTag b{color:#fff;font-weight:500}
nav{display:flex;gap:2px;margin-left:auto}
nav button{background:none;border:1px solid transparent;color:var(--mut);padding:7px 13px;font-size:10.5px;
  letter-spacing:.16em;cursor:pointer;border-radius:5px;transition:.2s}
nav button:hover{color:#fff}
nav button.act{color:#fff;border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.06)}
nav button.locked{opacity:.45}
#status{display:flex;align-items:center;gap:7px;font-size:9.5px;letter-spacing:.14em;color:var(--mut)}
#status i{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint);animation:bl 2.4s infinite}
@keyframes bl{50%{opacity:.35}}

.glass{background:var(--panel);border:1px solid var(--panel-line);border-radius:8px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

#console{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:25;width:min(740px,94vw);padding:11px 12px}
#chipsRow{display:flex;gap:6px;align-items:center;min-height:24px;margin-bottom:9px;flex-wrap:wrap;
  font-size:9px;letter-spacing:.2em;color:var(--dim)}
.sc{font-size:9.5px;letter-spacing:.1em;padding:3.5px 9px;border-radius:20px;border:1px solid var(--panel-line);color:var(--dim);transition:.25s}
.sc.run{color:#fff;border-color:#fff;box-shadow:0 0 10px rgba(255,255,255,.22);animation:bl 1s infinite}
.sc.hit{font-weight:600}
.sc.miss{color:var(--dim);text-decoration:line-through}
.sc.route{color:var(--amber);border-color:var(--amber)}
.sc.router{color:#fff;border-color:rgba(255,255,255,.3)}
#inRow{display:flex;gap:8px}
#q{flex:1;background:rgba(255,255,255,.045);border:1px solid var(--panel-line);border-radius:6px;
  color:#fff;padding:10px 13px;font-size:13px}
#q::placeholder{color:var(--dim)}
#go{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.3);
  color:#fff;padding:0 18px;border-radius:6px;font-size:11px;letter-spacing:.14em;cursor:pointer;transition:.2s}
#go:hover{box-shadow:0 0 14px rgba(255,255,255,.2);background:rgba(255,255,255,.1)}
#go:disabled{opacity:.4;cursor:default;box-shadow:none}
#presets{display:flex;gap:6px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#presets::-webkit-scrollbar{display:none}
.pr{flex-shrink:0;background:none;border:1px solid var(--panel-line);color:var(--mut);font-size:10px;
  padding:5px 11px;border-radius:20px;cursor:pointer;transition:.2s;letter-spacing:.03em}
.pr:hover{color:#fff;border-color:rgba(255,255,255,.35)}

#insp{position:fixed;right:14px;top:64px;z-index:22;width:330px;max-height:calc(100vh - 200px);
  padding:16px;overflow-y:auto;scrollbar-width:thin;display:none}
#insp.on{display:block}
#inspClose{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--dim);font-size:15px;cursor:pointer;padding:4px}
#inspClose:hover{color:#fff}
.badge{display:inline-block;font-size:8.5px;letter-spacing:.16em;padding:3px 8px;border-radius:4px;border:1px solid;margin:0 5px 5px 0}
#insp h2{font-family:var(--disp);font-weight:600;font-size:17px;margin:7px 0 3px;letter-spacing:.02em}
#insp h3{font-size:9px;letter-spacing:.22em;color:var(--dim);margin:15px 0 7px}
.row{display:flex;justify-content:space-between;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:11.5px}
.row span{color:var(--mut)}.row b{font-weight:500;text-align:right}
.cx{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:11px;cursor:pointer;color:var(--txt)}
.cx:hover{color:#fff}
.cx i{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cx em{font-style:normal;color:var(--dim);font-size:9px;letter-spacing:.1em;margin-left:auto}
.pct{color:var(--mut);font-size:9.5px}
.cmd{background:rgba(0,0,0,.55);border:1px solid var(--panel-line);border-radius:6px;padding:10px 12px;
  font-size:11px;line-height:1.7;overflow-x:auto;color:var(--teal);margin:8px 0;white-space:pre}
.ans p{font-size:12px;line-height:1.65;color:var(--txt);margin:7px 0}
.ans .mu{color:var(--mut);font-size:11px}
.xpTr{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin-top:4px}
.xpFl{height:100%;background:linear-gradient(90deg,var(--amber),var(--gold))}
.aBtn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.3);color:#fff;
  padding:7px 13px;border-radius:6px;font-size:10.5px;letter-spacing:.08em;cursor:pointer;margin:8px 6px 0 0}
.aBtn:hover{background:rgba(255,255,255,.1)}
.aBtn.warn{border-color:rgba(255,92,122,.45);color:var(--coral);background:rgba(255,92,122,.06)}
.cause{padding:7px 0 7px 11px;border-left:2px solid var(--coral);margin:7px 0;font-size:11.5px;line-height:1.55}
.cause b{color:var(--coral);font-weight:500}
.cause.ok{border-color:var(--mint)}.cause.ok b{color:var(--mint)}
.tl{font-size:9.5px;color:var(--mut);line-height:1.45;border-left:2px solid var(--dim);padding-left:8px;margin:5px 0}
.tl b{color:#fff;font-weight:500}

#toast{position:fixed;bottom:118px;left:50%;transform:translateX(-50%) translateY(20px);z-index:40;
  padding:9px 16px;font-size:11px;color:#fff;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#caption{position:fixed;left:16px;bottom:16px;z-index:15;font-size:9px;letter-spacing:.14em;color:var(--dim);max-width:230px;line-height:1.6}
#hint{position:fixed;right:16px;bottom:16px;z-index:15;font-size:9px;letter-spacing:.12em;color:var(--dim)}
#veil{position:fixed;inset:0;z-index:60;background:#050505;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;transition:opacity .8s}
#veil.off{opacity:0;pointer-events:none}
#veil span{font-family:var(--disp);letter-spacing:.35em;font-size:15px;color:#fff}
#veil i{width:120px;height:2px;background:rgba(255,255,255,.08);overflow:hidden;border-radius:2px;position:relative}
#veil i::after{content:'';position:absolute;left:-40%;width:40%;height:100%;background:#fff;animation:ld 1.1s infinite}
@keyframes ld{to{left:100%}}

@media (max-width:860px){
  #insp{left:10px;right:10px;top:auto;bottom:150px;width:auto;max-height:52vh}
  #caption,#hint{display:none}
  #status span{display:none}
  #demoTag{display:none}
  header{gap:8px;padding:0 10px}
  nav button{padding:7px 8px;font-size:9.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
addEventListener('error',e=>{
  const v=document.getElementById('veil');
  if(v&&!v.classList.contains('off'))v.innerHTML='<span style="color:#ff5c7a;font-size:11px;letter-spacing:.08em;max-width:80vw;text-align:center">ERREUR SCRIPT — '+(e.message||'inconnue')+'</span>';
});
if(typeof THREE==='undefined'){
  document.getElementById('veil').innerHTML='<span style="color:#ff5c7a;font-size:12px;letter-spacing:.08em">THREE.JS NON CHARGÉ — accès cdnjs.cloudflare.com requis</span>';
  throw new Error('THREE absent');
}
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);

/* ============================== DONNÉES SIMULÉES ============================== */
const TYPES = {
  machine:  {c:'#5aa7ff', l:'Machine'},
  service:  {c:'#46e3ff', l:'Service'},
  projet:   {c:'#b18cff', l:'Projet'},
  reseau:   {c:'#3fe8a8', l:'Réseau'},
  vlan:     {c:'#2f9f77', l:'VLAN (prévu)'},
  skill:    {c:'#ffb45e', l:'Skill'},
  incident: {c:'#ff5c7a', l:'Incident'},
  procedure:{c:'#6ef3d6', l:'Procédure'},
  stock:    {c:'#93a4bd', l:'Stock'},
  ambition: {c:'#ffd75e', l:'Ambition'},
  roadmap:  {c:'#f08fff', l:'Roadmap'},
  note:     {c:'#8fa0b8', l:'Note'}
};
const N0 = [
  ['m.srv1','machine','srv-app-01',{sub:'hôte applicatif',ip:'192.0.2.11',os:'Debian 12'}],
  ['m.srv2','machine','srv-data-01',{sub:'hôte base de données',ip:'192.0.2.12',os:'Debian 12'}],
  ['m.gpu','machine','srv-gpu-01',{sub:'inférence locale',ip:'192.0.2.13',note:'modèles ouverts'}],
  ['m.edge','machine','routeur',{sub:'passerelle · pare-feu',ip:'192.0.2.1'}],
  ['m.sw','machine','commutateur',{sub:'24 ports · VLAN'}],
  ['m.nas','machine','stockage',{sub:'sauvegardes',ip:'192.0.2.14'}],
  ['s.web','service','serveur-web',{host:'srv-app-01',note:'reverse proxy · TLS'}],
  ['s.db','service','postgres',{host:'srv-data-01',note:'base relationnelle'}],
  ['s.cache','service','redis',{host:'srv-app-01',note:'cache · files'}],
  ['s.api','service','api-interne',{host:'srv-app-01',note:'REST · authentification'}],
  ['s.mon','service','supervision',{host:'srv-app-01',note:'métriques · alertes'}],
  ['s.log','service','journalisation',{host:'srv-data-01',note:'collecte centralisée'}],
  ['s.syn','service','synapse',{host:'srv-gpu-01',note:'mémoire · recherche en cascade'}],
  ['v.10','reseau','VLAN 10 — administration',{sub:'accès aux équipements'}],
  ['v.20','reseau','VLAN 20 — serveurs',{sub:'charge applicative'}],
  ['v.30','reseau','VLAN 30 — collecteurs',{sub:'clients'}],
  ['v.40','reseau','VLAN 40 — invités',{sub:'isolé du reste'}],
  ['p.deploy','procedure','Déployer une mise à jour',{sub:'construire · migrer · basculer'}],
  ['p.backup','procedure','Restaurer une sauvegarde',{sub:'vérifier avant de remplacer'}],
  ['p.cert','procedure','Renouveler un certificat',{sub:'ACME · rechargement à chaud'}],
  ['p.audit','procedure','Revue de sécurité trimestrielle',{sub:'accès · secrets · dépendances'}],
  ['i.oom','incident','Conteneur tué par manque de mémoire',{sub:'limite trop basse'}],
  ['i.disk','incident','Disque saturé par les journaux',{sub:'rotation absente'}],
  ['i.tls','incident','Certificat expiré en production',{sub:'renouvellement non planifié'}],
  ['i.dns','incident','Résolution interne défaillante',{sub:'cache obsolète'}],
  ['n.arch','note','Pourquoi un reverse proxy unique',{sub:'un seul point de TLS à tenir'}],
  ['n.secret','note','Où vivent les secrets',{sub:'jamais dans le dépôt'}],
  ['n.backup','note','Une sauvegarde non testée n\'existe pas',{sub:'restaurer pour le prouver'}]
];
const E0 = [
  ['s.web','m.srv1','hébergé sur'],
  ['s.db','m.srv2','hébergé sur'],
  ['s.cache','m.srv1','hébergé sur'],
  ['s.api','m.srv1','hébergé sur'],
  ['s.syn','m.gpu','hébergé sur'],
  ['s.api','s.db','dépend de'],
  ['s.api','s.cache','dépend de'],
  ['s.web','s.api','achemine vers'],
  ['s.mon','s.log','écrit dans'],
  ['m.srv1','v.20','rattaché à'],
  ['m.srv2','v.20','rattaché à'],
  ['m.gpu','v.20','rattaché à'],
  ['m.edge','v.10','rattaché à'],
  ['i.oom','s.cache','concerne'],
  ['i.disk','m.srv1','concerne'],
  ['i.tls','s.web','concerne'],
  ['p.deploy','s.api','s\'applique à'],
  ['p.backup','m.nas','s\'applique à'],
  ['p.cert','s.web','s\'applique à'],
  ['n.arch','s.web','explique'],
  ['n.backup','p.backup','explique']
];
/* ============================================================
   Pont entre le prévisuel 3D et le vrai SYNAPSE.

   Chargement SYNCHRONE, volontairement.

   La scène se construit à la ligne qui suit (`const nodes = N.map…`).
   Un fetch asynchrone rendrait la main trop tard : la scène serait
   déjà bâtie sur le corpus de repli, et les vraies données
   arriveraient dans le vide. Il faudrait alors reconstruire toute
   la géométrie après coup — bien plus lourd que ces trente lignes.

   XMLHttpRequest synchrone est déconseillé en général, parce qu'il
   fige l'interface. Ici c'est au tout début du chargement d'une page
   dédiée, avec un délai plafonné : c'est précisément le cas où il
   reste légitime.

   Le corpus intégré n'est pas supprimé, il devient un REPLI :
     · le fichier reste ouvrable seul, sans backend ;
     · une base vide donnerait une scène vide, qui ressemble à une
       panne alors que tout fonctionne ;
     · si l'API ne répond pas, mieux vaut une scène de démonstration
       qu'un écran noir.

   Le bandeau dit toujours quelle source est affichée.
   ============================================================ */
(function () {
  'use strict';

  var API   = window.SYNAPSE_API   || '';
  var TOKEN = window.SYNAPSE_TOKEN || '';
  var NS    = window.SYNAPSE_NS    || 'shared';
  var MIN   = 8;   /* en dessous, la scène 3D n'a pas de forme lisible */

  function badge(texte, couleur) {
    function poser() {
      var el = document.createElement('div');
      el.textContent = texte;
      el.style.cssText =
        'position:fixed;top:8px;right:10px;z-index:9999;padding:4px 10px;' +
        'font:600 10px/1.4 ui-monospace,monospace;letter-spacing:.12em;' +
        'border:1px solid ' + couleur + '55;border-radius:5px;' +
        'color:' + couleur + ';background:#0a0a0acc';
      document.body.appendChild(el);
    }
    if (document.body) poser();
    else document.addEventListener('DOMContentLoaded', poser);
  }

  window.SYNAPSE_LIVE = false;

  try {
    var x = new XMLHttpRequest();
    x.open('GET', API + '/v1/graph?ns=' + encodeURIComponent(NS) + '&limit=1400', false);
    if (TOKEN) x.setRequestHeader('Authorization', 'Bearer ' + TOKEN);
    x.withCredentials = true;
    x.send(null);

    if (x.status !== 200) throw new Error('HTTP ' + x.status);
    var g = JSON.parse(x.responseText);

    if (!g.nodes || g.nodes.length < MIN) {
      badge('DÉMO · base presque vide (' + (g.total || 0) + ')', '#ffb45e');
    } else {
      /* format attendu par la scène : ['id','type','nom',{détails}] */
      window.N = g.nodes.map(function (n) { return [n.id, n.type, n.name, n.d || {}]; });
      window.E = g.edges.map(function (e) { return [e[0], e[1], e[2]]; });

      /* L'arbre groupe par type : le reconstruire à l'identique, sinon
         la disposition perd ses branches. */
      var parType = {};
      window.N.forEach(function (n) {
        (parType[n[1]] = parType[n[1]] || []).push(n[0]);
      });
      window.TREE = {
        name: 'noyau',
        children: Object.keys(parType).sort().map(function (t) {
          return { name: t, leaves: parType[t] };
        })
      };

      window.SYNAPSE_LIVE = true;
      badge('EN DIRECT · ' + g.nodes.length + ' entrées' +
            (g.truncated ? ' / ' + g.total : ''), '#3fe8a8');
    }
  } catch (e) {
    var why = /timeout|abort/i.test(String(e)) ? 'délai dépassé'
            : /401|403/.test(String(e))        ? 'jeton refusé'
            : 'hors ligne';
    badge('DÉMO · SYNAPSE ' + why, '#8a93c0');
  }
})();

/* le pont a peut-etre rempli window.N / window.E ; sinon, repli */
var N = window.SYNAPSE_LIVE ? window.N : N0;
var E = window.SYNAPSE_LIVE ? window.E : E0;

const nodes = N.map(([id,type,name,d])=>({id,type,name,d,deg:0}));
const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));
E.forEach(([a,b])=>{byId[a].deg++;byId[b].deg++;});

/* ============================== MOTEUR DE RECHERCHE ============================== */
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 .:\/+-]/g,' ');
const STOP = new Set('le la les de du des d un une sur quoi est ce cette que qui quel quelle quels mon ma mes en a au aux et ou pour avec dans comment combien y il elle je tu on sa ca ça plus fait faire liste montre moi va vers si son ses tout tous par donne affiche cherche trouve dis c l qu se ne pas'.split(' '));
const tok = s => norm(s).split(/\s+/).filter(t=>t&&!STOP.has(t));
const ALIAS = {'app':'m.srv1','srv1':'m.srv1','applicatif':'m.srv1',
  'data':'m.srv2','srv2':'m.srv2','donnees':'m.srv2',
  'gpu':'m.gpu','inference':'m.gpu','ia':'m.gpu',
  'routeur':'m.edge','passerelle':'m.edge','firewall':'m.edge',
  'switch':'m.sw','commutateur':'m.sw','nas':'m.nas','stockage':'m.nas',
  'web':'s.web','proxy':'s.web','nginx':'s.web','caddy':'s.web',
  'db':'s.db','postgres':'s.db','base':'s.db',
  'redis':'s.cache','cache':'s.cache','api':'s.api',
  'supervision':'s.mon','metriques':'s.mon','logs':'s.log','journaux':'s.log',
  'synapse':'s.syn','memoire':'s.syn'};
const TYPEKW={skill:'skill',skills:'skill',projet:'projet',projets:'projet',service:'service',services:'service',
  machine:'machine',machines:'machine',incident:'incident',incidents:'incident',pannes:'incident',
  stock:'stock',procedure:'procedure',procedures:'procedure',runbook:'procedure',runbooks:'procedure',
  note:'note',notes:'note',ambition:'ambition',ambitions:'ambition',roadmap:'roadmap'};
nodes.forEach(n=>{

/* Fusionne des milliers de tubes en UNE géométrie (position+index) → 1 draw call.
   MeshBasicMaterial n'a pas besoin de normales : on ne garde que position + index. */
function mergeTubes(pointArrays, radius, tubular, radial){
  let vTotal=0,iTotal=0;
  const geos=[];
  for(const pts of pointArrays){
    if(pts.length<2)continue;
    const curve=new THREE.CatmullRomCurve3(pts);
    const g=new THREE.TubeGeometry(curve,tubular,radius,radial,false);
    geos.push(g);vTotal+=g.attributes.position.count;iTotal+=g.index.count;
  }
  const pos=new Float32Array(vTotal*3);
  const idx=(vTotal>65535)?new Uint32Array(iTotal):new Uint16Array(iTotal);
  let vo=0,io=0;
  for(const g of geos){
    const pa=g.attributes.position.array;
    pos.set(pa,vo*3);
    const ia=g.index.array;
    for(let k=0;k<ia.length;k++)idx[io+k]=ia[k]+vo;
    vo+=g.attributes.position.count;io+=g.index.count;
    g.dispose();
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setIndex(new THREE.BufferAttribute(idx,1));
  return geo;
}

  const stageN=[...new Set(sc.stages.flatMap(s=>s.nodes||[]))];

const PRESETS=['Quelle IP est libre ?','Qu\'y a-t-il sur srv-app-01 ?','De quoi dépend l\'API ?','Qu\'est-ce que le proxy ?','Problème : supervision down','VLANs ?','Liste des skills','Quel est le sens de la vie ?'];
$('#presets').innerHTML=PRESETS.map(p=>'<button class="pr">'+p+'</button>').join('');
document.querySelectorAll('.pr').forEach(b=>b.onclick=()=>{qIn.value=b.textContent;think(b.textContent);});
$('#tabA').onclick=()=>toast('Ouvre SYNAPSE_previsuel_demo.html');
$('#tabG').onclick=()=>toast('GESTION — Phase 5, hors prévisuel');

/* ============================== BOUCLE ============================== */
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
addEventListener('resize',resize);resize();
let first=true;
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now(),t=now*.001;
  ctl.th+=(ctl.thG-ctl.th)*.07;ctl.ph+=(ctl.phG-ctl.ph)*.07;ctl.r+=(ctl.rG-ctl.r)*.07;ctl.tg.lerp(ctl.tgG,.06);
  camera.position.set(
    ctl.tg.x+ctl.r*Math.sin(ctl.ph)*Math.cos(ctl.th),
    ctl.tg.y+ctl.r*Math.cos(ctl.ph),
    ctl.tg.z+ctl.r*Math.sin(ctl.ph)*Math.sin(ctl.th));
  camera.lookAt(ctl.tg);
  if(!reduced&&!dragging)world.rotation.y+=.00035;
  world.updateMatrixWorld(true);
  /* nappes : respiration + couche active éclairée */
  frames.forEach((m)=>{
    const lit=m._layer===progress?.95:(m._layer<progress?(m._base+.1):m._base);
    m.opacity+=(lit+Math.sin(t*1.3+(m._layer||0))*.015-m.opacity)*.08;
  });
  frameMats.forEach(({m,i})=>{
    const target=i===progress?.95:(i<progress?.6:.42);
    m.opacity+=(target-m.opacity)*.1;
  });
  fanMats.forEach((m,i)=>{
    const target=i<progress?.6:.4;
    m.opacity+=(target-m.opacity)*.08;
  });
  if(le serveur de vecteursMode)ctxFrame.material.opacity=.5+.4*Math.sin(t*4);
  else ctxFrame.material.opacity+=(0-ctxFrame.material.opacity)*.1;
  if(coreFlash){
    const a=(now-coreFlash)/600;
    flashFrame.material.opacity=a<1?.6*(1-a):0;
    const s2=1+ (a<1?a*.12:0);flashFrame.scale.set(s2,s2,1);
    if(a>=1)coreFlash=0;
  }
  /* particules le long des fibres */
  particles.forEach(p=>{
    if(p.state==='travel'&&p.tr){
      p.tr.t+=16.7/p.tr.dur*(reduced?3:1);
      if(p.tr.t>=1){
        p.fi=p.tr.i1;p.sq=p.tr.sqIdx;p.tr=null;
        p.state=p.sq===0?'idle':'sel';
        p.sp.position.copy(fiberAt(p,p.fi));
      }else if(p.tr.t>0){
        const e=1-Math.pow(1-p.tr.t,3);
        p.fi=p.tr.i0+(p.tr.i1-p.tr.i0)*e;
        p.sp.position.copy(fiberAt(p,p.fi));
      }
    }else{
      const base=fiberAt(p,p.fi);
      p.sp.position.set(
        base.x+Math.sin(t*.8+p.ph)*.12,
        base.y+Math.cos(t*.7+p.ph*1.3)*.12,
        base.z);
    }
    /* fibre : retour progressif vers son état cible */
    p.fMat.opacity+=(p.fTo.op-p.fMat.opacity)*.06;
    p.fMat.color.lerp(p.fTo.col,.06);
    const isWin=winner===p.id;
    const sc2=isWin?1.7+Math.sin(t*6)*.35:(p.state==='sel'||p.state==='travel'?1.2:1.05);
    p.sp.scale.set(sc2,sc2,1);
  });
  /* flux d'information */
  for(let i=flows.length-1;i>=0;i--){
    const f=flows[i];f.fi+=f.sp*(reduced?3:1);
    if(f.fi>=f.p.fiber.length-1){world.remove(f.s);f.s.material.dispose();flows.splice(i,1);}
    else f.s.position.copy(fiberAt(f.p,f.fi));
  }
  /* labels */
  labelPool.forEach(el=>el._seen=false);
  const cnt=counts();
  XS.forEach((x,i)=>{
    const h=LH[i]/2;
    const eT=lbl('sqT'+i,SQMETA[i].label,SQMETA[i].sub,'sqt');
    placeLabel(eT,wpos(new THREE.Vector3(x,h+3,0)));eT._seen=true;
    let big,sub2;
    if(i<=progress){
      if(i===4&&le serveur de vecteursMode){big='▸';sub2='SERVEUR DE VECTEURS';}
      else{big=String(i===0?63:cnt[i]);
        const prev=i===0?63:(i===1?63:cnt[i-1]||1);
        sub2=i===0?'NEURONES':'−'+Math.round((1-(i===0?63:cnt[i])/Math.max(1,prev))*100)+'%';}
    }else{big='—';sub2='';}
    const eC=lbl('sqC'+i,big,sub2,'cnt');
    eC.style.color=i===4&&winner?'#3fe8a8':(i===4&&le serveur de vecteursMode?'#ffb45e':'');
    placeLabel(eC,wpos(new THREE.Vector3(x,-h-2.2,0)));eC._seen=true;
  });
  particles.forEach(p=>{
    if(activeLabels.has(p.id)||winner===p.id){
      const n=byId[p.id];
      const el=lbl(p.id,n.name,n.d.sub||TYPES[n.type].l.toUpperCase());
      p.sp.getWorldPosition(WP);placeLabel(el,WP);el._seen=true;
    }
  });
  labelPool.forEach(el=>{if(!el._seen)el.classList.remove('on');});
  renderer.render(scene,camera);
  if(first){first=false;$('#veil').classList.add('off');}
}
loop();
/* Pas de requête au chargement : la scène se montre, l'utilisateur
   interroge quand il le décide. */
</script>
</body>
</html>
