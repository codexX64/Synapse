<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYNAPSE — cerveaux</title>
<link rel="stylesheet" href="/v/__VERSION__/vendor/polices.css">
<style>
:root{ --haut:56px; --bg:#050505; --panel:rgba(12,12,13,.9); --line:rgba(255,255,255,.09);
       --txt:#f1f1f1; --mut:#9c9c9c; --dim:#575757; --mint:#3fe8a8; --coral:#ff5c7a;
       --amber:#ffb45e; --violet:#b18cff; --or:#d9c56a;
       --mono:'JetBrains Mono',monospace; --disp:'Space Grotesk',sans-serif; --gauche:300px; --droite:370px; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#050505;color:var(--txt);font-family:var(--mono);font-size:12px}
canvas#ciel{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas#ciel.tire{cursor:grabbing}
header{position:fixed;top:0;left:0;right:0;z-index:30;height:var(--haut);display:flex;align-items:center;gap:14px;padding:0 20px;
  background:linear-gradient(180deg,rgba(5,5,5,.95),rgba(5,5,5,.55) 75%,transparent)}
#marque{font-family:var(--disp);font-weight:600;font-size:18px;letter-spacing:.32em}
.tag{border:1px solid rgba(63,232,168,.45);color:var(--mint);font-size:9.5px;letter-spacing:.2em;padding:5px 9px;border-radius:4px;white-space:nowrap}
header nav{margin-left:auto;display:flex;gap:6px;align-items:center}
header nav a,header nav button{color:var(--mut);text-decoration:none;font-size:9.5px;letter-spacing:.18em;padding:8px 10px;border:1px solid transparent;
  border-radius:6px;background:none;font-family:var(--mono);cursor:pointer;white-space:nowrap}
header nav a:hover,header nav button:hover{color:#fff;border-color:var(--line)}
header nav a.ici{color:#fff;border-color:rgba(255,255,255,.22)}
.panneau{position:fixed;top:calc(var(--haut) + 8px);bottom:16px;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  backdrop-filter:blur(14px);display:flex;flex-direction:column;overflow:hidden}
#gauche{left:16px;width:var(--gauche)}
#droite{right:16px;width:var(--droite);transform:translateX(calc(100% + 24px));transition:transform .28s ease}
#droite.ouvert{transform:none}
.onglets{display:flex;border-bottom:1px solid var(--line)}
.onglets button{flex:1;background:none;border:0;color:var(--dim);font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;padding:13px 4px;cursor:pointer}
.onglets button.act{color:#fff;box-shadow:inset 0 -1.5px 0 var(--mint)}
.corps{overflow-y:auto;padding:14px 16px 18px;flex:1}
.corps::-webkit-scrollbar{width:6px}.corps::-webkit-scrollbar-thumb{background:#222;border-radius:3px}
h3{font-size:9px;letter-spacing:.22em;color:var(--dim);font-weight:400;margin:16px 0 8px}
h3:first-child{margin-top:2px}
.sous{font-size:10.5px;color:var(--mut);line-height:1.55}
.ligne{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--mut);font-size:11.5px}
.ligne:hover{background:rgba(255,255,255,.04);color:#fff}
.ligne.sel{background:rgba(255,255,255,.07);color:#fff}
.ligne .pt{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ligne .n{margin-left:auto;color:var(--dim);font-size:10px}
.ligne .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dom{margin-top:6px}
.dom>.ligne{color:#fff;font-weight:500}
.dom .enf{margin-left:14px;border-left:1px solid var(--line);padding-left:4px}
button.b{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.25);color:#fff;padding:8px 12px;border-radius:6px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;cursor:pointer}
button.b:hover:not(:disabled){background:rgba(255,255,255,.11)}
button.b:disabled{opacity:.35;cursor:default}
button.p{border-color:rgba(63,232,168,.45);color:var(--mint)}
button.w{border-color:rgba(255,92,122,.45);color:var(--coral)}
button.s{padding:5px 9px;font-size:9px}
input,select{width:100%;background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:6px;color:#fff;padding:8px 10px;
  font-family:var(--mono);font-size:11.5px}
input:focus,select:focus{outline:1.5px solid rgba(255,255,255,.3)}
label{display:block;font-size:8.5px;letter-spacing:.18em;color:var(--dim);margin:10px 0 5px}
.rang input,.rang select{flex:1;width:auto;min-width:0}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.rang{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.carte{border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:8px;background:rgba(255,255,255,.02)}
.carte .t{font-size:11.5px;color:#fff;line-height:1.45;word-break:break-word}
.carte .m{font-size:9.5px;color:var(--dim);margin-top:4px;letter-spacing:.06em}
.carte a{color:inherit;text-decoration:none}.carte a:hover .t{color:var(--mint)}
.badge{display:inline-block;font-size:8.5px;letter-spacing:.16em;padding:3px 7px;border-radius:4px;border:1px solid var(--line);color:var(--mut)}
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.chiffres div{border:1px solid var(--line);border-radius:8px;padding:10px}
.chiffres b{display:block;font-family:var(--disp);font-size:18px;font-weight:600}
.chiffres span{font-size:8.5px;letter-spacing:.16em;color:var(--dim)}
#titre{font-family:var(--disp);font-size:20px;font-weight:600;line-height:1.2;word-break:break-word}
#fermer{position:absolute;top:10px;right:12px;z-index:2;background:rgba(12,12,13,.96);border:1px solid var(--line);border-radius:6px;color:var(--mut);font-size:13px;cursor:pointer;padding:5px 9px}
#fermer:hover{color:#fff}
.vide{color:var(--dim);font-size:10.5px;padding:6px 0;line-height:1.5}
#bulle{position:fixed;z-index:25;pointer-events:none;background:rgba(10,10,11,.94);border:1px solid var(--line);border-radius:6px;
  padding:7px 10px;font-size:10.5px;display:none;max-width:260px}
#bulle b{display:block;color:#fff;font-weight:500;margin-bottom:2px}
#bulle span{color:var(--mut)}
#legende{position:fixed;left:calc(var(--gauche) + 32px);bottom:20px;z-index:15;display:flex;gap:14px;flex-wrap:wrap;font-size:9px;letter-spacing:.16em;color:var(--mut);pointer-events:none}
#legende i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
#commandes{position:fixed;right:20px;bottom:20px;z-index:15;display:flex;gap:8px;transition:right .28s ease}
body.detail #commandes{right:calc(var(--droite) + 32px)}
#msg{position:fixed;left:50%;top:calc(var(--haut) + 12px);transform:translateX(-50%);z-index:40;padding:9px 14px;border-radius:6px;font-size:11px;
  display:none;max-width:min(90vw,520px);text-align:center}
#msg.ok{display:block;background:rgba(63,232,168,.12);border:1px solid rgba(63,232,168,.4);color:var(--mint)}
#msg.no{display:block;background:rgba(255,92,122,.12);border:1px solid rgba(255,92,122,.4);color:var(--coral)}
#voile{position:fixed;inset:0;z-index:35;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;
  background:rgba(5,5,5,.86);color:var(--mut);line-height:1.6}
#voile b{display:block;color:#fff;font-family:var(--disp);font-size:16px;margin-bottom:8px}
dialog{background:#0c0c0d;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:20px;width:min(92vw,360px);margin:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
.jeton{word-break:break-all;background:rgba(63,232,168,.08);border:1px dashed rgba(63,232,168,.4);border-radius:6px;padding:10px;margin-top:8px;color:var(--mint)}
.boutonsmob{display:none}
@media (max-width:900px){
  :root{--gauche:260px;--droite:320px}
}
@media (max-width:700px){
  header{padding:0 12px;gap:8px}
  #marque{font-size:14px;letter-spacing:.24em}
  .tag{display:none}
  header nav a.cache{display:none}
  .panneau{left:8px!important;right:8px!important;width:auto!important;top:auto;bottom:8px;height:58vh;transform:translateY(calc(100% + 16px));transition:transform .28s ease}
  #gauche.ouvert,#droite.ouvert{transform:none}
  #legende{left:12px;bottom:64px}
  #commandes,body.detail #commandes{right:12px;bottom:12px}
  .boutonsmob{display:inline-block}
}
</style>
</head>
<body>
<canvas id="ciel" aria-label="Constellation des cerveaux"></canvas>
<header>
  <div id="marque">SYNAPSE</div>
  <div class="tag" id="etiquette">CERVEAUX</div>
  <nav>
    <button class="boutonsmob" id="menuMob">☰ MENU</button>
    <a href="/" class="cache">MÉMOIRE</a>
    <a href="/cerveaux" class="ici">CERVEAUX</a>
    <a href="/parametres" class="cache" title="Paramètres">⚙</a>
    <a href="/compte" title="Mon compte">◉</a>
  </nav>
</header>

<aside class="panneau" id="gauche">
  <div class="onglets" role="tablist">
    <button class="act" data-onglet="arbre">ARBRE</button>
    <button data-onglet="projets">PROJETS</button>
    <button data-onglet="instance">INSTANCE</button>
  </div>
  <div class="corps" id="ongletArbre"></div>
  <div class="corps" id="ongletProjets" hidden></div>
  <div class="corps" id="ongletInstance" hidden></div>
</aside>

<aside class="panneau" id="droite" aria-live="polite">
  <button id="fermer" title="Fermer">✕</button>
  <div class="corps" id="fiche"></div>
</aside>

<div id="legende"></div>
<div id="commandes">
  <button class="b s" id="tourne" title="Rotation lente">↻ ROTATION</button>
  <button class="b s" id="recentre" title="Recentrer">◎ RECENTRER</button>
</div>
<div id="bulle"></div>
<div id="msg"></div>
<div id="voile"></div>

<dialog id="renfort">
  <form method="dialog">
    <div style="font-family:var(--disp);font-size:15px;margin-bottom:6px">Confirmer ton identité</div>
    <div class="sous">Ce réglage touche toute l'instance : il demande une confirmation récente.</div>
    <label id="rfLabel">Mot de passe</label>
    <input id="rfChamp" type="password" autocomplete="current-password">
    <div id="rfErr" style="color:var(--coral);font-size:10.5px;margin-top:6px"></div>
    <div class="rang"><button class="b" value="non">ANNULER</button><button class="b p" value="oui">CONFIRMER</button></div>
  </form>
</dialog>

<script nonce="__NONCE__">
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[<>&"']/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = n => Number(n || 0).toLocaleString('fr-FR');

/* api
   Même contrat que les autres pages : session du socle, jeton anti-CSRF
   sur toute écriture, renfort proposé quand le serveur le demande. */
let CSRF = '';
let minuteurMsg = 0;
function msg(t, ok) {
  const m = $('#msg'); m.textContent = t || ''; m.className = t ? (ok ? 'ok' : 'no') : '';
  clearTimeout(minuteurMsg); if (t) minuteurMsg = setTimeout(() => { m.className = ''; }, 4200);
}
async function api(chemin, corps, methode, renfortFait = false) {
  const m = methode || (corps ? 'POST' : 'GET');
  if (m !== 'GET' && !CSRF) CSRF = ((await api('/api/compte/etat')).session || {}).csrf || '';
  const r = await fetch(chemin, {
    method: m, credentials: 'same-origin',
    headers: { ...(corps ? { 'Content-Type': 'application/json' } : {}), ...(m !== 'GET' ? { 'X-CSRF': CSRF } : {}) },
    body: corps ? JSON.stringify(corps) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (j && j.csrf) CSRF = j.csrf;
  if (r.status === 401) { location.href = '/connexion'; throw new Error('session'); }
  if (r.status === 403 && j.details && j.details.renfort && !renfortFait) {
    if (await renforcer(j.details.methodes || [])) return api(chemin, corps, methode, true);
    throw new Error('Geste annulé : identité non confirmée.');
  }
  if (!r.ok) { const e = new Error(j.error || 'HTTP ' + r.status); e.status = r.status; throw e; }
  return j;
}
const b64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0)).buffer;
async function renforcer(methodes) {
  const m = ['cle', 'totp', 'motdepasse'].find(x => methodes.includes(x)) || 'motdepasse';
  if (m === 'cle' && window.PublicKeyCredential) {
    try {
      const o = await api('/api/compte/renfort/options', {});
      const pk = PublicKeyCredential.parseRequestOptionsFromJSON ? PublicKeyCredential.parseRequestOptionsFromJSON(o)
        : { ...o, challenge: b64(o.challenge), allowCredentials: (o.allowCredentials || []).map(c => ({ ...c, id: b64(c.id) })) };
      const c = await navigator.credentials.get({ publicKey: pk });
      await api('/api/compte/renfort', { methode: 'cle', reponse: c.toJSON() });
      return true;
    } catch (e) { msg(e.message || 'clé d’accès refusée'); return false; }
  }
  const d = $('#renfort'), champ = $('#rfChamp'), err = $('#rfErr');
  $('#rfLabel').textContent = m === 'totp' ? 'Code de ton application (6 chiffres)' : 'Mot de passe';
  champ.type = m === 'totp' ? 'text' : 'password'; champ.value = ''; err.textContent = '';
  for (;;) {
    d.showModal(); champ.focus();
    const choix = await new Promise(r => d.addEventListener('close', () => r(d.returnValue), { once: true }));
    if (choix !== 'oui') return false;
    try {
      await api('/api/compte/renfort', m === 'totp' ? { methode: 'totp', code: champ.value.trim() } : { methode: 'motdepasse', motDePasse: champ.value });
      return true;
    } catch (e) { err.textContent = e.message; champ.value = ''; }
  }
}

/* état */
const COULEURS = ['#3fe8a8', '#b18cff', '#ffb45e', '#5cc8ff', '#ff5c7a', '#e6e070', '#7aa2ff', '#ff9ad5'];
const S = { donnees: null, iCompte: 0, cerveaux: new Map(), sel: null, zoom: 1, panX: 0, panY: 0, rot: 0, tourne: true, particules: [], anciens: new Map() };
const compteVu = () => S.donnees ? S.donnees.comptes[S.iCompte] || S.donnees.comptes[0] : null;
const nomCompte = c => c === '@principal' ? 'Mon arbre' : c === '@commun' ? 'Commun' : (c === S.donnees?.compte ? 'Mon arbre' : c);

/* mise en place
   Le global au centre, les domaines racines en couronne, leurs
   sous-domaines un cran plus loin, les cerveaux membres sur l'anneau
   extérieur, chacun dans le secteur de son domaine. Les tailles suivent le
   logarithme du volume : un cerveau de 140 000 entrées reste lisible à côté
   d'un cerveau de 20. */
function rayon(n, base, pas) { return base + pas * Math.log10((n || 0) + 1); }
function hex(r, pas) {
  const pts = [], h = pas * Math.sqrt(3) / 2;
  for (let y = -r; y <= r; y += h) {
    const dec = Math.round(y / h) % 2 ? pas / 2 : 0;
    for (let x = -r + dec; x <= r; x += pas) if (x * x + y * y <= r * r) pts.push([x, y]);
  }
  return pts;
}
function hasard(graine) { let s = graine >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

function construire() {
  const a = compteVu();
  S.cerveaux.clear();
  if (!a) return;
  const doms = a.domaines;
  const parId = new Map(doms.map(d => [d.id, d]));
  const racines = doms.filter(d => !d.parent_id);
  const enfants = id => doms.filter(d => d.parent_id === id);
  const poids = d => 1 + d.membres.length + enfants(d.id).reduce((s, e) => s + poids(e), 0);
  const total = racines.reduce((s, d) => s + poids(d), 0) || 1;
  const couleurDe = new Map();
  racines.forEach((d, i) => couleurDe.set(d.id, COULEURS[i % COULEURS.length]));
  const couleur = d => couleurDe.get(d.id) || (d.parent_id ? couleur(parId.get(d.parent_id)) : '#9c9c9c');

  const g = a.global;
  const RG = rayon(g.n, 70, 16);
  S.cerveaux.set(g.id, { id: g.id, genre: 'global', nom: 'Cerveau global', n: g.n, x: 0, y: 0, r: RG, couleur: '#ffffff', reglages: g.reglages, parent: null, compte: a.compte });

  let angle = -Math.PI / 2;
  const R1 = RG + 150;
  const place = (d, a0, a1, niveau, parentC) => {
    const mid = (a0 + a1) / 2, rr = R1 + niveau * 110;
    const c = d.commun;
    const rc = rayon(c.n, 18, 8);
    const cc = { id: c.id, genre: 'commun', nom: d.nom, domaine: d, n: c.n, x: Math.cos(mid) * rr, y: Math.sin(mid) * rr, r: rc,
      couleur: couleur(d), reglages: c.reglages, parent: parentC, compte: a.compte, a0, a1 };
    S.cerveaux.set(c.id, cc);
    const sous = enfants(d.id);
    const ms = d.membres;
    /* les membres d'un domaine sur l'anneau au-delà de ses sous-domaines */
    const Rm = R1 + (niveau + 1 + (sous.length ? 1 : 0)) * 110 + 30;
    ms.forEach((m, i) => {
      const t = ms.length === 1 ? mid : a0 + (a1 - a0) * (i + 0.5) / ms.length;
      const r = rayon(m.n, 10, 7);
      const decal = ms.length > 6 && i % 2 ? 46 : 0;
      S.cerveaux.set(m.id, { id: m.id, genre: 'membre', nom: m.nom, membre: m.membre, domaine: d, n: m.n,
        x: Math.cos(t) * (Rm + decal), y: Math.sin(t) * (Rm + decal), r, couleur: couleur(d), parent: cc, compte: a.compte });
    });
    const ps = sous.map(poids), tot = ps.reduce((s, p) => s + p, 0) || 1;
    let b = a0;
    sous.forEach((e, i) => { const l = (a1 - a0) * ps[i] / tot; place(e, b, b + l, niveau + 1, cc); b += l; });
  };
  for (const d of racines) {
    const l = 2 * Math.PI * poids(d) / total;
    const marge = Math.min(0.08, l * 0.08);
    place(d, angle + marge, angle + l - marge, 0, S.cerveaux.get(g.id));
    angle += l;
  }
  for (const c of S.cerveaux.values()) {
    if (c.genre === 'commun' && !c.parent) c.parent = S.cerveaux.get(g.id);
    const pas = c.genre === 'global' ? 0 : c.genre === 'commun' ? 4.6 : 4.2;
    c.pts = pas ? hex(c.r, pas) : [];
  }
  /* la nébuleuse du global : ses points prennent la couleur des domaines,
     au prorata de ce qu'ils y ont fait monter */
  const al = hasard(g.id * 7919 + (g.n || 0));
  const communs = [...S.cerveaux.values()].filter(c => c.genre === 'commun' && c.parent && c.parent.genre === 'global');
  const somme = communs.reduce((s, c) => s + (c.n || 0) + 1, 0) || 1;
  const N = Math.min(2400, 500 + Math.round(Math.log10((g.n || 0) + 1) * 260));
  const neb = [];
  for (let i = 0; i < N; i++) {
    const u = al(), v = al(), rr = Math.sqrt(-2 * Math.log(u + 1e-9)) * RG * 0.42, th = 2 * Math.PI * v;
    let tire = al() * somme, col = '#ffffff';
    for (const c of communs) { tire -= (c.n || 0) + 1; if (tire <= 0) { col = c.couleur; break; } }
    if (al() < 0.45) col = '#e8ecf2';
    neb.push([Math.cos(th) * rr, Math.sin(th) * rr, col, 0.25 + al() * 0.75, al() * 6.28]);
  }
  S.cerveaux.get(g.id).neb = neb;
  S.borne = Math.max(...[...S.cerveaux.values()].map(c => Math.hypot(c.x, c.y) + c.r)) + 46;
  legende(racines.map(d => [d.nom, couleur(d)]));
}

function legende(l) {
  $('#legende').innerHTML = l.map(([n, c]) => `<span><i style="background:${c}"></i>${esc(n.toUpperCase())}</span>`).join('')
    + '<span><i style="background:#fff"></i>GLOBAL</span>';
}

/* dessin */
const ciel = $('#ciel'), ctx = ciel.getContext('2d');
let L = 0, H = 0, DPR = 1;
function taille() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  L = ciel.clientWidth; H = ciel.clientHeight;
  ciel.width = L * DPR; ciel.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
function centreEcran() {
  const mob = innerWidth <= 700;
  const g = mob ? 0 : parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gauche')) + 16;
  const d = mob || !document.body.classList.contains('detail') ? 0 : parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--droite')) + 16;
  return [g + (L - g - d) / 2, 56 + (H - 56) / 2];
}
function ajuster() {
  if (!S.borne) return;
  const mob = innerWidth <= 700;
  const g = mob ? 0 : parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gauche')) + 16;
  const dispo = Math.min(L - g - 40, H - 100);
  S.zoom = Math.max(0.15, dispo / (2 * S.borne)); S.panX = 0; S.panY = 0;
}
function versEcran(x, y) {
  const c = Math.cos(S.rot), s = Math.sin(S.rot);
  const [cx, cy] = centreEcran();

let tPrec = performance.now();
function image(t) {
  const dt = Math.min(64, t - tPrec); tPrec = t;
  if (S.tourne && !S.tire) S.rot += dt * 0.000018;

  const a = compteVu();
  if (a && S.cerveaux.size) {
    const z = S.zoom;
    /* l'enceinte : un anneau de points dorés */
    const [ox, oy] = versEcran(0, 0);
    const R = S.borne * z;
    ctx.fillStyle = 'rgba(217,197,106,.75)';
    const nb = Math.max(120, Math.floor(R * 0.9));
    for (let i = 0; i < nb; i++) {
      const th = i / nb * 6.2832 + S.rot;
      for (const k of [0, 2.2]) ctx.fillRect(ox + Math.cos(th) * (R + k * z) - 0.8, oy + Math.sin(th) * (R + k * z) - 0.8, 1.6, 1.6);
    }
    /* liens : chaque cerveau vers celui où il remonte */
    ctx.lineWidth = 1;
    for (const c of S.cerveaux.values()) {
      if (!c.parent) continue;
      const [x1, y1] = versEcran(c.x, c.y), [x2, y2] = versEcran(c.parent.x, c.parent.y);
      ctx.strokeStyle = hexa(c.couleur, S.sel && (S.sel === c.id || S.sel === c.parent.id) ? 0.4 : 0.09);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    /* nébuleuse du global */
    const g = S.cerveaux.get(a.global.id);
    const tt = t * 0.0006;
    for (const [x, y, col, al, ph] of g.neb) {
      const [sx, sy] = versEcran(x, y);
      ctx.fillStyle = hexa(col, al * (0.55 + 0.45 * Math.sin(tt + ph)) * (S.sel === g.id ? 1 : 0.85));
      const p = Math.max(1, 1.5 * z);
      ctx.fillRect(sx - p / 2, sy - p / 2, p, p);
    }
    const halo = ctx.createRadialGradient(ox, oy, 0, ox, oy, g.r * z * 1.3);
    halo.addColorStop(0, 'rgba(255,255,255,.16)'); halo.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(ox, oy, g.r * z * 1.3, 0, 6.2832); ctx.fill();
    /* amas : communs et membres */
    for (const c of S.cerveaux.values()) {
      if (c.genre === 'global') continue;
      const [cx, cy] = versEcran(c.x, c.y);
      const sel = S.sel === c.id, survol = S.survol === c.id;
      c.pulse = Math.max(0, (c.pulse || 0) - dt * 0.0012);
      const lum = c.genre === 'commun' ? 0.95 : 0.72;
      if (c.genre === 'commun') {
        ctx.strokeStyle = hexa(c.couleur, 0.35); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(cx, cy, (c.r + 7) * z, 0, 6.2832); ctx.stroke();
      }
      if (sel || survol || c.pulse > 0) {
        const gl = ctx.createRadialGradient(cx, cy, 0, cx, cy, (c.r + 22) * z);
        gl.addColorStop(0, hexa(c.couleur, 0.22 + c.pulse * 0.3)); gl.addColorStop(1, hexa(c.couleur, 0));
        ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(cx, cy, (c.r + 22) * z, 0, 6.2832); ctx.fill();
      }
      ctx.fillStyle = hexa(c.couleur, sel || survol ? 1 : lum);
      const p = Math.max(1, 1.9 * z);
      const vide = !c.n;
      for (const [dx, dy] of c.pts) {
        if (vide && (dx * 7 + dy * 3) % 3 > 0.6) continue;
        ctx.fillRect(cx + dx * z - p / 2, cy + dy * z - p / 2, p, p);
      }
      if (sel) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(cx, cy, (c.r + 11) * z, 0, 6.2832); ctx.stroke(); }
      const montrer = c.genre === 'commun' || sel || survol || z > 0.95 || (S.cerveaux.size <= 40 && z > 0.45);
      if (montrer) {
        ctx.font = `${c.genre === 'commun' ? 600 : 400} ${c.genre === 'commun' ? 11 : 10}px "JetBrains Mono",monospace`;
        ctx.textAlign = 'center'; ctx.fillStyle = c.genre === 'commun' ? '#ffffff' : 'rgba(241,241,241,.8)';
        const nom = c.genre === 'commun' ? c.nom.toUpperCase() : c.nom;

      }
    }
    ctx.font = '600 13px "JetBrains Mono",monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.fillText('GLOBAL', ox, oy - 2);
    ctx.font = '10px "JetBrains Mono",monospace'; ctx.fillStyle = 'rgba(241,241,241,.65)';
    ctx.fillText(nf(a.global.n) + (a.global.n > 1 ? ' entrées' : ' entrée'), ox, oy + 13);
    /* remontées en cours : une particule de l'enfant vers le parent */
    S.particules = S.particules.filter(pa => pa.t < 1);
    for (const pa of S.particules) {
      pa.t += dt / pa.duree;
      const e = pa.t < 0.5 ? 2 * pa.t * pa.t : 1 - Math.pow(-2 * pa.t + 2, 2) / 2;

}
function hexa(h, a) {

/* interactions : glisser, molette, pincer, survoler, choisir */
function sous(x, y) {
  let best = null, d = Infinity;
  for (const c of S.cerveaux.values()) {
    const [sx, sy] = versEcran(c.x, c.y);
    const dd = Math.hypot(sx - x, sy - y);
    if (dd < Math.max(14, (c.r + 6) * S.zoom) && dd < d) { d = dd; best = c; }
  }

}
const pointeurs = new Map();
let depart = null, pince = 0, bouge = false;
ciel.addEventListener('pointerdown', e => {
  ciel.setPointerCapture(e.pointerId); pointeurs.set(e.pointerId, [e.clientX, e.clientY]);
  depart = [e.clientX, e.clientY, S.panX, S.panY]; bouge = false; S.tire = true; ciel.classList.add('tire');
  if (pointeurs.size === 2) { const [a, b] = [...pointeurs.values()]; pince = Math.hypot(a[0] - b[0], a[1] - b[1]); }
});
ciel.addEventListener('pointermove', e => {
  if (pointeurs.has(e.pointerId)) pointeurs.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointeurs.size === 2) {
    const [a, b] = [...pointeurs.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]);

    const dx = e.clientX - depart[0], dy = e.clientY - depart[1];
    if (Math.abs(dx) + Math.abs(dy) > 4) bouge = true;
    S.panX = depart[2] + dx; S.panY = depart[3] + dy;
    return;
  }
  const c = sous(e.clientX, e.clientY);
  S.survol = c ? c.id : null;
  const b = $('#bulle');
  if (c) {
    b.innerHTML = `<b>${esc(c.genre === 'global' ? 'Cerveau global' : c.nom)}</b><span>${c.genre === 'membre' ? 'membre · ' + esc(c.domaine.nom) : c.genre}${' · ' + nf(c.n)} ${c.n > 1 ? 'entrées' : 'entrée'}</span>`;
    b.style.display = 'block'; b.style.left = Math.min(innerWidth - 270, e.clientX + 14) + 'px'; b.style.top = (e.clientY + 14) + 'px';

  } else { b.style.display = 'none'; ciel.style.cursor = ''; }
});
const lacher = e => {

ciel.addEventListener('pointerup', lacher); ciel.addEventListener('pointercancel', lacher);

    const liste = v => v.split(',').map(s => s.trim()).filter(Boolean);
    try {
      const j = await api('/v1/hierarchie/reglages', { cerveau: c.id, seuil: +$('#rSeuil').value, convergence: +$('#rConv').value,
        repetition_heures: +$('#rRep').value, fenetre_jours: +$('#rFen').value, remontee: $('#rMode').value,
        toujours: liste($('#rToujours').value), jamais: liste($('#rJamais').value) }, 'PUT');
      c.reglages = j.reglages; msg('Tamis enregistré.', true);
    } catch (e) { msg(e.message); }
  };
  if (c.genre === 'membre') $('#domOk').onclick = async () => {
    try { await api('/v1/hierarchie/rattacher', { cerveau: c.id, domaine: +$('#dom').value }, 'PUT'); msg('Cerveau rattaché.', true); await charger(); choisir(c.id, true); }
    catch (e) { msg(e.message); }
  };
  /* fiches et remontées, en parallèle */
  api(`/v1/hierarchie/chercher?cerveau=${c.id}&q=fiche&monter=0&limit=40`).then(j => {
    const f = j.hits.filter(h => String(h.kind).startsWith('fiche.'));
    $('#nFiches').textContent = nf(f.length) + (f.length === 40 ? '+' : '');
    $('#fiches').innerHTML = f.length ? f.slice(0, 12).map(carteEntree).join('') : `<div class="vide">${c.genre === 'membre' ? 'Les fiches naissent au-dessus : dans le commun de son domaine.' : 'Aucune fiche : il faut deux origines sur une même clé.'}</div>`;
  }).catch(e => { $('#nFiches').textContent = '–'; $('#fiches').innerHTML = `<div class="vide">${esc(e.message)}</div>`; });
  api(`/v1/hierarchie/remontees?cerveau=${c.id}&limit=30`).then(j => {
    const att = j.remontees.filter(x => x.statut === 'a_valider');
    $('#nAttente').textContent = nf(att.length);
    $('#rem').innerHTML = j.remontees.length ? j.remontees.map(x => {
      const sens = x.vers_cerveau === c.id ? 'arrivée' : 'départ';
      const coul = x.statut === 'a_valider' ? 'var(--amber)' : x.statut === 'refusee' ? 'var(--coral)' : 'var(--mint)';
      return `<div class="carte"><a href="/e/${x.entry_id}"><div class="t">${esc(x.title)}</div></a>
        <div class="m"><span style="color:${coul}">${esc(x.statut.replace('_', ' '))}</span> · ${sens} · règle ${esc(x.regle)} · ${new Date(x.quand).toLocaleString('fr-FR')}</div>
        ${x.statut === 'a_valider' && x.vers_cerveau === c.id ? `<div class="rang"><button class="b s p" data-v="${x.id}" data-ok="1">MONTER</button><button class="b s w" data-v="${x.id}" data-ok="0">REFUSER</button></div>` : ''}</div>`;
    }).join('') : '<div class="vide">Aucune remontée.</div>';
    $('#rem').querySelectorAll('[data-v]').forEach(b => b.onclick = async () => {
      try { await api('/v1/hierarchie/valider', { id: +b.dataset.v, accepter: b.dataset.ok === '1' }); msg('Remontée tranchée.', true); rendreFiche(c); } catch (e) { msg(e.message); }
    });
  }).catch(e => {
    $('#nAttente').textContent = '–';
    $('#rem').innerHTML = `<div class="vide">${e.status === 403 ? 'Lecture réservée à une personne connectée.' : esc(e.message)}</div>`;
  });
}
function carteEntree(h) {
  const de = S.cerveaux.get(h.cerveau);
  return `<div class="carte"><a href="/e/${h.id}"><div class="t">${esc(h.title)}</div></a>
    <div class="m">${esc(h.kind)} · ${esc(h.source)}${de ? ' · ' + esc(de.genre === 'global' ? 'global' : de.nom) : ''} · ${new Date(h.occurred_at).toLocaleDateString('fr-FR')}</div></div>`;
}

/* onglets et mobile */
document.querySelectorAll('.onglets button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.onglets button').forEach(x => x.classList.toggle('act', x === b));
  for (const o of ['arbre', 'projets', 'instance']) $('#onglet' + o[0].toUpperCase() + o.slice(1)).hidden = o !== b.dataset.onglet;
  if (b.dataset.onglet === 'projets') rendreProjets();
});
$('#menuMob').onclick = () => { $('#gauche').classList.toggle('ouvert'); $('#droite').classList.remove('ouvert'); };

/* données
   L'arbre est relu toutes les 8 secondes. Un cerveau qui a grossi envoie
   des particules vers celui où il remonte : on voit la mémoire travailler. */
function rendreTout() { rendreArbre(); rendreInstance(); const c = S.sel && S.cerveaux.get(S.sel); if (c) rendreFiche(c); }
async function charger() {
  let d;
  try { d = await api('/v1/hierarchie'); }
  catch (e) {
    const v = $('#voile');
    v.innerHTML = e.status === 404 ? '<div><b>Pas encore de hiérarchie</b>Cette instance de SYNAPSE n’est pas en 3.0 : la hiérarchie des cerveaux arrive avec la mise à jour.</div>'
      : `<div><b>Lecture impossible</b>${esc(e.message)}</div>`;
    v.style.display = 'flex'; return false;
  }
  const premier = !S.donnees;
  S.donnees = d;
  if (S.iCompte >= d.comptes.length) S.iCompte = 0;
  construire();
  if (premier) { ajuster(); }
  else {
    for (const c of S.cerveaux.values()) {
      const avant = S.anciens.get(c.id);
      if (avant !== undefined && c.n > avant && c.parent) {
        c.pulse = 1;
        for (let i = 0; i < Math.min(6, c.n - avant); i++)
          S.particules.push({ de: c, vers: c.parent, t: -i * 0.12, duree: 1300 + Math.random() * 500, couleur: c.couleur });
      }
    }
  }
  S.anciens = new Map([...S.cerveaux.values()].map(c => [c.id, c.n]));
  $('#etiquette').textContent = `CERVEAUX · ${S.cerveaux.size - 1} · ${nf(d.comptes[S.iCompte]?.global.n || 0)} AU GLOBAL`;
  if (S.sel && !S.cerveaux.has(S.sel)) fermer();
  /* même structure : seuls les compteurs changent, rien de ce qu'on tape
     ou lit dans les panneaux n'est effacé */
  const signature = d.mode + '|' + d.comptes.map(c => c.compte + ':' + c.domaines.map(x => x.id + x.nom + x.parent_id + x.verse + ':' + x.membres.map(m => m.id).join(',')).join(';')).join('/');
  if (premier || signature !== S.signature) { S.signature = signature; rendreArbre(); rendreInstance(); }
  else document.querySelectorAll('#ongletArbre [data-c]').forEach(x => { const c = S.cerveaux.get(+x.dataset.c); if (c) x.querySelector('.n').textContent = nf(c.n); });
  return true;
}

taille();
requestAnimationFrame(image);
charger().then(ok => { if (ok) setInterval(() => { if (!document.hidden) charger(); }, 8000); });
</script>
